<body><main><a class="back" href="index.html">← กลับหน้าแรก</a><h1>ความเป็นส่วนตัว</h1><p>หน้าเว็บนี้ไม่ใช้คุกกี้ และไม่เก็บข้อมูลส่วนตัวของผู้เข้าชม</p><p>ตัวเกมเก็บความคืบหน้า เช่น เลเวล ของในกระเป๋า และจดหมาย ไว้บนเซิร์ฟเวอร์ของเกมเพื่อให้เล่นต่อได้ทุกเครื่อง เราไม่ขายหรือส่งข้อมูลนี้ให้ใคร</p><p>อยากให้ลบข้อมูลตัวละคร แจ้งผู้พัฒนาในกลุ่มที่ได้ลิงก์นี้มาได้เลย</p></main></body></html>
